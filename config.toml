# Trading Dashboard configuration.
# Change a value, save the file and restart the app (Ctrl+C, then ./start.sh).

[app]
host = "127.0.0.1"   # only reachable from this Mac
port = 8000
timezone = "Europe/Amsterdam"

[account]
currency = "EUR"
starting_capital = 1000
leverage = 100
risk_per_trade_pct = 2.0

[execution]
# paper | live
# "paper": only paper trading, no orders at the broker.
# "live":  paper trading plus live strategies at cTrader. Every live strategy also needs
#          a confirmation in the dashboard in which you type the amounts.
mode = "paper"

[live]
# Real-money accounts are refused unless this is true. Demo accounts are always allowed.
allow_real_money = false
max_capital = 1000             # most EUR a single live strategy may use
redirect_url = "http://localhost:8000/ctrader/callback"   # exactly as registered at openapi.ctrader.com

[data]
# Phase 1 uses Dukascopy (free, no account). BlackBull (cTrader) follows later.
provider = "dukascopy"
default_symbol = "XAUUSD"
default_timeframe = "H1"

[paper]
# How often (in seconds) live prices are fetched and paper strategies run.
poll_seconds = 30
# Keep this Mac awake while paper strategies are running (macOS only).
keep_awake = true

[risk]
# Hard limits. They are enforced outside the strategies: a strategy cannot override them.
# Each paper session is its own account; daily loss and position size count per session.
max_daily_loss_pct = 2.0        # at this loss since 00:00 (Dutch time): close, cancel, stop until tomorrow
max_open_positions = 3          # open positions over all running strategies together
max_risk_per_trade_pct = 2.0    # a trade never risks more than this % of equity
max_lots_default = 1.0          # max position size (lots) for instruments not listed below
weekend_close = true            # forex/metals: close positions that are in profit before the weekend
weekend_close_minutes_before = 30   # ... this many minutes before Friday's close (17:00 New York)

[risk.max_lots]
XAUUSD = 1.0
XAGUSD = 1.0
BTCUSD = 0.5
ETHUSD = 5.0

[alerts]
# E-mail only for urgent problems. The address and Gmail app password go in .env.
feed_down_minutes = 15          # prices/broker unreachable this long
repeat_minutes = 60             # at most one e-mail per problem per hour
loop_errors = 3                 # the loop failed this many rounds in a row
reconcile_minutes = 5           # how often the bookkeeping is reconciled
email_on_reconciliation = true  # e-mail when the reconciliation finds a difference
